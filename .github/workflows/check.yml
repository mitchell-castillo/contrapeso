name: Validate Contrapeso
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check app.mjs && node --check engine.mjs && node --check progress.mjs
      - run: node --test
      - run: node tools/check-static.mjs
